<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image processing</title><style>*{box-sizing:border-box}html,body{margin:0;width:1425px;height:1425px;overflow:hidden;background:#fff}canvas{display:block;width:1425px;height:1425px}#ready{display:none}</style></head><body>
<canvas id="output" width="1425" height="1425"></canvas><span id="ready">ready</span>
<script>
(async()=>{
 const img=new Image();img.src="./assets/travelkl-photo.svg";await img.decode();
 const c=document.getElementById("output"),ctx=c.getContext("2d");
 ctx.filter="blur(38px)";ctx.drawImage(img,0,0,1425,1425);
 document.getElementById("ready").style.display="block";
})();
</script></body></html>
