<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Portfolio | Shoman</title>
<link rel="stylesheet" href="./portfolio.css">
</head>
<body class="marketing-portfolio-page">
<main class="portfolio-shell">
 <header class="portfolio-masthead">
  <h1>Marketing Portfolio</h1>
  <div class="certificate-dock" aria-label="Outreach certificate">
   <button class="certificate-preview" type="button" data-certificate-open="./portfolio-assets/outreachcertificate.png" aria-label="View outreach certificate full size">
    <img src="./portfolio-assets/outreachcertificate.png" alt="Outreach certificate" loading="eager" fetchpriority="high">
    <span class="certificate-zoom" aria-hidden="true">↗</span>
   </button>
  </div>
 </header>
 <section class="marketing-slider" aria-label="Marketing samples">
  <div class="category-tabs" role="tablist" aria-label="Marketing sample categories">
   <button class="category-tab" type="button" role="tab" id="tab-outreach" aria-selected="true" aria-controls="marketing-slide" data-category="outreach">Outreach</button>
   <button class="category-tab" type="button" role="tab" id="tab-social" aria-selected="false" aria-controls="marketing-slide" data-category="social">Social Media</button>
  </div>
  <div class="slider-toolbar">
   <span class="slider-caption" id="slide-category">OUTREACH</span>
   <span class="slider-label" id="slide-label">Outreach sequences</span>
   <span class="slider-counter" id="slide-counter">01 / 04</span>
  </div>
  <div class="slider-image-wrap" id="marketing-slide"><img id="marketing-slide-image" src="./portfolio-assets/outreach-sequences.png" alt="Outreach sequence sample" loading="eager" fetchpriority="high"></div>
 </section>
</main>
<div class="certificate-viewer" id="certificate-viewer" hidden aria-hidden="true">
 <button type="button" class="certificate-close" data-certificate-close aria-label="Close certificate">×</button>
 <img id="certificate-full-image" alt="Full-size certificate">
</div>
<script>
(function(){
 const categories={
  outreach:{title:"OUTREACH",items:[
   {src:"./portfolio-assets/outreach-sequences.png",alt:"Outreach sequences dashboard",label:"Outreach sequences"},
   {src:"./portfolio-assets/coldemail21.png",alt:"Cold email sample one",label:"Cold email 01"},
   {src:"./portfolio-assets/coldemail23.jpg",alt:"Cold email sample two",label:"Cold email 02"},
   {src:"./portfolio-assets/coldemail24.png",alt:"Cold email sample three",label:"Cold email 03"}
  ]},
  social:{title:"SOCIAL MEDIA",items:[
   {src:"./portfolio-assets/content1.PNG",alt:"Social media content sample one",label:"Social media 01"},
   {src:"./portfolio-assets/content2.png",alt:"Social media content sample two",label:"Social media 02"},
   {src:"./portfolio-assets/content4.png",alt:"Social media content sample three",label:"Social media 03"}
  ]}
 };
 const categoryOrder=["outreach","social"];
 let category="outreach",index=0;
 const image=document.getElementById("marketing-slide-image");
 const title=document.getElementById("slide-category");
 const label=document.getElementById("slide-label");
 const countEl=document.getElementById("slide-counter");
 const slide=document.getElementById("marketing-slide");
 const viewer=document.getElementById("certificate-viewer");
 const full=document.getElementById("certificate-full-image");
 const notify=()=>{
  const position=categoryOrder.indexOf(category);
  const globalIndex=categoryOrder.slice(0,position).reduce((sum,key)=>sum+categories[key].items.length,0)+index;
  const total=categoryOrder.reduce((sum,key)=>sum+categories[key].items.length,0);
  window.parent.postMessage({
   type:"desk-portfolio:state",canPrev:globalIndex>0,canNext:globalIndex<total-1,index:globalIndex,total
  },window.location.origin);
 };
 const render=()=>{
  const group=categories[category],item=group.items[index];
  image.src=item.src;image.alt=item.alt;title.textContent=group.title;label.textContent=item.label;
  countEl.textContent=String(index+1).padStart(2,"0")+" / "+String(group.items.length).padStart(2,"0");
  document.querySelectorAll("[data-category]").forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.category===category)));
  notify();
 };
 const move=direction=>{
  const sequence=categoryOrder.flatMap(key=>categories[key].items.map((item,itemIndex)=>({category:key,index:itemIndex})));
  const current=sequence.findIndex(item=>item.category===category&&item.index===index);
  const target=Math.max(0,Math.min(sequence.length-1,current+direction));
  if(target===current)return;
  category=sequence[target].category;index=sequence[target].index;render();
 };
 document.querySelectorAll("[data-category]").forEach(tab=>tab.addEventListener("click",()=>{
  category=tab.dataset.category;index=0;render();
 }));
 window.addEventListener("message",event=>{
  if(event.source!==window.parent||event.origin!==window.location.origin)return;
  if(event.data?.type==="desk-portfolio:navigate")move(Number(event.data.direction)||0);
 });
 document.addEventListener("keydown",event=>{
  if(!viewer.hidden)return;
  if(event.key==="ArrowLeft"){event.preventDefault();move(-1)}
  if(event.key==="ArrowRight"){event.preventDefault();move(1)}
 });
 let swipeStartX=null;
 slide.addEventListener("pointerdown",event=>{swipeStartX=event.clientX});
 slide.addEventListener("pointerup",event=>{
  if(swipeStartX===null)return;
  const delta=event.clientX-swipeStartX;swipeStartX=null;
  if(Math.abs(delta)<45)return;
  move(delta<0?1:-1);
 });
 slide.addEventListener("pointercancel",()=>{swipeStartX=null});
 let wheelTotal=0,wheelLocked=false,wheelTimer=null;
 document.querySelector(".marketing-slider").addEventListener("wheel",event=>{
  if(!viewer.hidden)return;
  event.preventDefault();
  if(Math.abs(event.deltaY)<2)return;
  wheelTotal+=event.deltaY;
  clearTimeout(wheelTimer);
  if(!wheelLocked&&Math.abs(wheelTotal)>=38){
   move(wheelTotal>0?1:-1);wheelTotal=0;wheelLocked=true;
  }
  wheelTimer=setTimeout(()=>{wheelTotal=0;wheelLocked=false},380);
 },{passive:false});
 const close=()=>{viewer.hidden=true;viewer.setAttribute("aria-hidden","true");full.src=""};
 document.querySelectorAll("[data-certificate-open]").forEach(button=>button.addEventListener("click",()=>{
  full.src=button.dataset.certificateOpen;full.alt=button.querySelector("img").alt+" full size";
  viewer.hidden=false;viewer.setAttribute("aria-hidden","false");
 }));
 viewer.addEventListener("click",event=>{if(event.target===viewer||event.target.closest("[data-certificate-close]"))close()});
 document.addEventListener("keydown",event=>{if(event.key==="Escape")close()});
 render();
})();
</script>
</body>
</html>
