<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Portfolio | Shoman</title>
<link rel="stylesheet" href="./portfolio.css">
</head>
<body>
<main class="portfolio-shell">
 <header class="portfolio-masthead">
  <h1>Marketing Portfolio</h1>
  <div class="certificate-dock" aria-label="Marketing certificates">
   <button class="certificate-preview" type="button" data-certificate-open="./portfolio-assets/outreachcertificate.png" aria-label="View outreach certificate full size">
    <img src="./portfolio-assets/outreachcertificate.png" alt="Outreach certificate" loading="eager" fetchpriority="high">
    <span class="certificate-zoom" aria-hidden="true">↗</span>
   </button>
   <button class="certificate-preview" type="button" data-certificate-open="./portfolio-assets/contentcertificate.png" aria-label="View content certificate full size">
    <img src="./portfolio-assets/contentcertificate.png" alt="Content certificate" loading="eager" fetchpriority="high">
    <span class="certificate-zoom" aria-hidden="true">↗</span>
   </button>
  </div>
 </header>

 <section class="samples" aria-label="Marketing work samples">
  <article class="sample">
   <h2>Outreach sequences</h2>
   <div class="sample-media"><img src="./portfolio-assets/outreach-sequences.png" alt="Original outreach sequences sample" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Cold email sample 01</h2>
   <div class="sample-media"><img src="./portfolio-assets/coldemail21.png" alt="Original cold email sample one" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Cold email sample 02</h2>
   <div class="sample-media"><img src="./portfolio-assets/coldemail23.jpg" alt="Original cold email sample two" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Cold email sample 03</h2>
   <div class="sample-media"><img src="./portfolio-assets/coldemail24.png" alt="Original cold email sample three" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Content sample 01</h2>
   <div class="sample-media"><img src="./portfolio-assets/content1.PNG" alt="Original content sample one" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Content sample 02</h2>
   <div class="sample-media"><img src="./portfolio-assets/content2.png" alt="Original content sample two" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Content sample 03</h2>
   <div class="sample-media"><img src="./portfolio-assets/content4.png" alt="Original content sample three" loading="lazy"></div>
  </article>
 </section>
</main>

<div class="certificate-viewer" id="certificate-viewer" hidden aria-hidden="true">
 <button type="button" class="certificate-close" data-certificate-close aria-label="Close certificate">×</button>
 <img id="certificate-full-image" alt="Full-size certificate">
</div>

<script>
(function(){
 const viewer=document.getElementById("certificate-viewer");
 const full=document.getElementById("certificate-full-image");
 const close=()=>{viewer.hidden=true;viewer.setAttribute("aria-hidden","true");full.src=""};
 document.querySelectorAll("[data-certificate-open]").forEach(button=>button.addEventListener("click",()=>{
  full.src=button.dataset.certificateOpen;full.alt=button.querySelector("img").alt+" full size";
  viewer.hidden=false;viewer.setAttribute("aria-hidden","false");
 }));
 viewer.addEventListener("click",event=>{if(event.target===viewer||event.target.closest("[data-certificate-close]"))close()});
 document.addEventListener("keydown",event=>{if(event.key==="Escape")close()});
})();
</script>
</body>
</html>
