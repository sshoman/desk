<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Portfolio | Shoman</title>
<link rel="stylesheet" href="./portfolio.css">
</head>
<body>
<main class="portfolio-shell">
 <header class="portfolio-masthead">
  <h1>Design Portfolio</h1>
  <div class="certificate-dock" aria-label="Design certificate">
   <button class="certificate-preview" type="button" data-certificate-open="./assets/graphicdesign-certificate-preview.jpg" aria-label="View graphic design certificate full size">
    <img src="./assets/graphicdesign-certificate-preview.jpg" alt="Graphic design certificate" loading="eager" fetchpriority="high">
    <span class="certificate-zoom" aria-hidden="true">↗</span>
   </button>
  </div>
 </header>

 <section class="samples" aria-label="Design work samples">
  <article class="sample">
   <h2>Xntry</h2>
   <div class="sample-media"><iframe src="https://xntry.pages.dev/" title="Xntry live product website" loading="lazy"></iframe></div>
  </article>
  <article class="sample">
   <h2>Junior</h2>
   <div class="sample-media"><iframe src="./junior-showcase.html" title="Junior product dashboard" loading="lazy"></iframe></div>
  </article>
  <article class="sample">
   <h2>UoMe</h2>
   <div class="sample-media sample-gallery">
    <button type="button" class="gallery-control previous" id="uome-prev" aria-label="Previous UoMe sample">‹</button>
    <img id="uome-image" src="https://ph-files.imgix.net/bd1d5891-2b9f-427d-9e8e-f1c7c913f74c.png?auto=format&amp;fit=max&amp;w=1400" alt="UoMe original product screenshot 1">
    <button type="button" class="gallery-control next" id="uome-next" aria-label="Next UoMe sample">›</button>
   </div>
  </article>
  <article class="sample">
   <h2>Outbound Fox</h2>
   <div class="sample-media"><iframe src="https://outboundfox.pages.dev/" title="Outbound Fox live product site" loading="lazy"></iframe></div>
  </article>
  <article class="sample">
   <h2>Graphic sample 01</h2>
   <div class="sample-media"><img src="./portfolio-assets/graphic1.png" alt="Original graphic design sample one" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Graphic sample 02</h2>
   <div class="sample-media"><img src="./portfolio-assets/graphic2.PNG" alt="Original graphic design sample two" loading="lazy"></div>
  </article>
  <article class="sample">
   <h2>Video sample 01</h2>
   <div class="sample-media video-media"><iframe src="https://www.youtube-nocookie.com/embed/kjrx2ApRApg" title="Video sample one" loading="lazy" allowfullscreen></iframe></div>
  </article>
  <article class="sample">
   <h2>Video sample 02</h2>
   <div class="sample-media video-media"><iframe src="https://www.youtube-nocookie.com/embed/oWfo5clc7Mw" title="Video sample two" loading="lazy" allowfullscreen></iframe></div>
  </article>
 </section>
</main>

<div class="certificate-viewer" id="certificate-viewer" hidden aria-hidden="true">
 <button type="button" class="certificate-close" data-certificate-close aria-label="Close certificate">×</button>
 <img id="certificate-full-image" alt="Full-size certificate">
</div>

<script>
(function(){
 const images=[
  "https://ph-files.imgix.net/bd1d5891-2b9f-427d-9e8e-f1c7c913f74c.png?auto=format&fit=max&w=1400",
  "https://ph-files.imgix.net/70fab33a-f197-4a2a-8c07-725057f725d5.png?auto=format&fit=max&w=1400",
  "https://ph-files.imgix.net/be78ff0f-e256-40e1-963e-4ea36285c7a6.png?auto=format&fit=max&w=1400"
 ];
 let current=0;
 const image=document.getElementById("uome-image");
 function render(){image.src=images[current];image.alt="UoMe original product screenshot "+(current+1)}
 document.getElementById("uome-prev").addEventListener("click",()=>{current=(current+images.length-1)%images.length;render()});
 document.getElementById("uome-next").addEventListener("click",()=>{current=(current+1)%images.length;render()});

 const viewer=document.getElementById("certificate-viewer");
 const full=document.getElementById("certificate-full-image");
 const close=()=>{viewer.hidden=true;viewer.setAttribute("aria-hidden","true");full.src=""};
 document.querySelectorAll("[data-certificate-open]").forEach(button=>button.addEventListener("click",()=>{
  full.src=button.dataset.certificateOpen;full.alt=button.querySelector("img").alt+" full size";
  viewer.hidden=false;viewer.setAttribute("aria-hidden","false");
 }));
 viewer.addEventListener("click",event=>{if(event.target===viewer||event.target.closest("[data-certificate-close]"))close()});
 document.addEventListener("keydown",event=>{if(event.key==="Escape")close()});
})();
</script>
</body>
</html>
