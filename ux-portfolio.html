<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/">
<meta name="theme-color" content="#211a14">
<title>UX Portfolio | Shoman</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xntry.pages.dev" crossorigin>
<link rel="preconnect" href="https://outboundfox.pages.dev" crossorigin>
<link rel="prefetch" href="./uome-demo.html" as="document">
<link rel="prefetch" href="https://xntry.pages.dev/" as="document" crossorigin>
<link rel="prefetch" href="https://outboundfox.pages.dev/" as="document" crossorigin>
<link rel="stylesheet" href="./portfolio.css?v=uome-chatbot-2019-gold-20261109c">
</head>
<body class="ux-portfolio-page">
<main class="portfolio-shell">
 <section class="ux-cover" id="ux-cover" aria-label="UX portfolio introduction">
  <div class="ux-cover-copy">
   <p class="ux-cover-kicker">Selected product work</p>
   <h1>UX Portfolio</h1>
   <p class="ux-cover-subtitle">A collection of product experiences, interfaces and ideas brought to life.</p>
   <div class="ux-cover-rule"></div>
   <button class="ux-cover-action" id="ux-cover-next" type="button">
    <span>Explore the work</span>
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5"/></svg>
   </button>
   <div class="ux-cover-footnote">Scroll down or use next to open the first project</div>
  </div>
  <button class="ux-cover-certificate" type="button" data-certificate-open="./portfolio-assets/graphicdesign_certificate.png" aria-label="View graphic design certificate full size">
   <img src="./portfolio-assets/graphicdesign_certificate.png" alt="Graphic design certificate" loading="eager" fetchpriority="high">
  </button>
 </section>

 <section class="ux-project-viewer" id="ux-project-viewer" aria-label="Selected UX project" hidden>
  <div class="ux-project-media">
   <iframe id="ux-project-frame" src="about:blank" title="UX project preview" loading="eager"></iframe>
  </div>
 </section>

 <div class="ux-loader" id="ux-loader" hidden aria-live="polite" aria-atomic="true">
  <div class="ux-loader-card">
   <div class="ux-folio-stack" aria-hidden="true"><span></span><span></span><span>+</span></div>
   <div class="ux-loader-kicker">From the shelf</div>
   <h2>Bringing the next folio to the desk</h2>
   <p id="ux-loader-project">Opening the first project</p>
   <div class="ux-loader-track" aria-hidden="true"><span></span></div>
  </div>
 </div>
</main>

<nav class="portfolio-float-controls" aria-label="Portfolio controls">
 <button type="button" id="ux-float-prev" aria-label="Previous project"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
 <button type="button" id="ux-float-next" aria-label="Next project"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
 <button type="button" id="ux-float-close" aria-label="Close portfolio"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
</nav>

<div class="certificate-viewer" id="certificate-viewer" hidden aria-hidden="true">
 <button type="button" class="certificate-close" data-certificate-close aria-label="Close certificate">×</button>
 <img id="certificate-full-image" alt="Full-size certificate">
</div>

<script>
(function(){
 const projects=[
  {title:"Junior",src:"./junior-showcase.html"},
  {title:"UoMe · Invoice with voice",src:"./uome-demo.html?v=uome-invoice-voice-calendar-20261109e"},
  {title:"Xntry",src:"https://xntry.pages.dev/"},
  {title:"Outbound Fox",src:"https://outboundfox.pages.dev/"}
 ];
 let current=-1;
 const embedded=window.parent!==window;
 if(embedded)document.body.classList.add("portfolio-embedded");
 let pendingSrc="";
 let loadedSrc="";
 let loaderShownAt=0;
 let wheelLocked=false;
 const cover=document.getElementById("ux-cover");
 const viewer=document.getElementById("ux-project-viewer");
 const frame=document.getElementById("ux-project-frame");
 const loader=document.getElementById("ux-loader");
 const loaderProject=document.getElementById("ux-loader-project");
 const notify=()=>window.parent.postMessage({
  type:"desk-portfolio:state",
  canPrev:current>=0,
  canNext:current<projects.length-1,
  index:current+1,
  total:projects.length+1
 },window.location.origin);

 function hideLoaderAfterPaint(){
  const src=pendingSrc;
  const elapsed=Date.now()-loaderShownAt;
  const wait=Math.max(0,260-elapsed);
  window.setTimeout(()=>{
   if(current>=0&&projects[current].src===src&&loadedSrc===src)loader.hidden=true;
  },wait);
 }
 function prefetchProject(index){
  const project=projects[index];
  if(!project||project.src===pendingSrc)return;
  if(document.querySelector('link[data-ux-prefetch="'+project.src+'"]'))return;
  const link=document.createElement("link");
  link.rel="prefetch";link.as="document";link.href=project.src;
  link.setAttribute("data-ux-prefetch",project.src);
  document.head.appendChild(link);
 }
 function attachInnerScroll(){
  try{
   const win=frame.contentWindow;
   if(!win||win.location.origin!==window.location.origin)return;
   const doc=frame.contentDocument;
   const handler=event=>{
    if(Math.abs(event.deltaY)<40||wheelLocked)return;
    const appScroller=event.target&&event.target.closest?event.target.closest(".uome-app-scroll"):null;
    if(event.target&&event.target.closest&&event.target.closest(".phone")&&!appScroller)return;
    const scroller=appScroller||(doc.scrollingElement||doc.documentElement);
    const viewport=appScroller?appScroller.clientHeight:win.innerHeight;
    const atTop=scroller.scrollTop<=4;
    const atBottom=scroller.scrollTop+viewport>=scroller.scrollHeight-4;
    if(event.deltaY>0&&!atBottom)return;
    if(event.deltaY<0&&!atTop)return;
    event.preventDefault();
    wheelLocked=true;
    move(event.deltaY>0?1:-1);
    window.setTimeout(()=>{wheelLocked=false},650);
   };
   doc.addEventListener("wheel",handler,{capture:true,passive:false});
  }catch(_){}
 }
 frame.addEventListener("load",()=>{
  if(!pendingSrc||frame.getAttribute("src")!==pendingSrc)return;
  loadedSrc=pendingSrc;
  if(current>=0&&projects[current].src===loadedSrc)hideLoaderAfterPaint();
  attachInnerScroll();
  prefetchProject(Math.max(1,current+1));
 });

 function render(){
  if(current<0){
   cover.hidden=false;viewer.hidden=true;loader.hidden=true;
  }else{
   const project=projects[current];
   cover.hidden=true;viewer.hidden=false;
   frame.title=project.title+" project preview";
   loaderProject.textContent=project.title;
   if(loadedSrc===project.src){
    loader.hidden=true;
   }else{
    loader.hidden=false;loaderShownAt=Date.now();
    if(pendingSrc!==project.src){
     pendingSrc=project.src;
     frame.src=project.src;
    }
   }
   prefetchProject(current+1);
  }
  notify();
 }
 function move(direction){
  const target=Math.max(-1,Math.min(projects.length-1,current+direction));
  if(target===current)return;
  current=target;render();
 }
 document.getElementById("ux-float-prev").addEventListener("click",()=>move(-1));
 document.getElementById("ux-float-next").addEventListener("click",()=>move(1));
 document.getElementById("ux-float-close").addEventListener("click",()=>{
  if(embedded)window.parent.postMessage({type:"desk-portfolio:close"},window.location.origin);
  else window.location.assign("/");
 });
 document.getElementById("ux-cover-next").addEventListener("click",()=>move(1));
 window.addEventListener("message",event=>{
  if(event.source!==window.parent||event.origin!==window.location.origin)return;
  if(event.data?.type==="desk-portfolio:navigate")move(Number(event.data.direction)||0);
 });
 function wheelMove(event){
  if(Math.abs(event.deltaY)<40||wheelLocked)return;
  event.preventDefault();
  wheelLocked=true;
  move(event.deltaY>0?1:-1);
  window.setTimeout(()=>{wheelLocked=false},650);
 }
 window.addEventListener("wheel",wheelMove,{passive:false});
 document.addEventListener("keydown",event=>{
  if(event.key==="ArrowDown"||event.key==="ArrowRight"){event.preventDefault();move(1)}
  if(event.key==="ArrowUp"||event.key==="ArrowLeft"){event.preventDefault();move(-1)}
 });

 /* Warm the first project behind the cover so Next feels immediate. */
 pendingSrc=projects[0].src;
 frame.src=pendingSrc;
 prefetchProject(1);
 render();

 const certViewer=document.getElementById("certificate-viewer");
 const full=document.getElementById("certificate-full-image");
 const close=()=>{certViewer.hidden=true;certViewer.setAttribute("aria-hidden","true");full.src=""};
 document.querySelectorAll("[data-certificate-open]").forEach(button=>button.addEventListener("click",()=>{
  full.src=button.dataset.certificateOpen;
  full.alt=button.querySelector("img").alt+" full size";
  certViewer.hidden=false;certViewer.setAttribute("aria-hidden","false");
 }));
 certViewer.addEventListener("click",event=>{
  if(event.target===certViewer||event.target.closest("[data-certificate-close]"))close();
 });
 document.addEventListener("keydown",event=>{if(event.key==="Escape")close()});
})();
</script>
</body>
</html>
