<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image processing</title><style>*{box-sizing:border-box}html,body{margin:0;width:960px;height:960px;overflow:hidden;background:#fff}canvas{display:block;width:960px;height:960px}#ready{display:none}</style></head><body>
<canvas id="output" width="960" height="960"></canvas><span id="ready">ready</span>
<script>
(async()=>{
 const img=new Image();img.src="./assets/traveltlv-photo.svg";await img.decode();
 const c=document.getElementById("output"),ctx=c.getContext("2d");
 ctx.drawImage(img,0,0,960,960);
 ctx.save();ctx.beginPath();ctx.roundRect(828,155,132,430,16);ctx.clip();
 ctx.filter="blur(14px)";ctx.drawImage(img,0,0,960,960);ctx.restore();
 document.getElementById("ready").style.display="block";
})();
</script></body></html>
